services:
  frontend:
    build:
      context: ../../frontend
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8000
      - NEXT_PUBLIC_WS_URL=ws://localhost:8000
    depends_on:
      - backend
    networks:
      - pitchcraft_network

  backend:
    build:
      context: ../..
      dockerfile: backend/Dockerfile
    ports:
      - "8000:8000"
    environment:
      - MONGODB_URL=mongodb://mongodb:27017
      - MONGODB_DB_NAME=pitchcraft
      - REDIS_URL=redis://redis:6379/0
      - CELERY_BROKER_URL=redis://redis:6379/1
      - CELERY_RESULT_BACKEND=redis://redis:6379/2
      - EMBEDDING_SERVICE_URL=http://embedding:8001
    env_file:
      - ../../.env
    volumes:
      - uploaded_files:/data/uploads
      - pptx_output:/data/output
    depends_on:
      mongodb:
        condition: service_healthy
      redis:
        condition: service_healthy
      embedding:
        condition: service_started
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    networks:
      - pitchcraft_network

  worker:
    build:
      context: ../..
      dockerfile: backend/Dockerfile
    command: celery -A backend.core.tasks worker --loglevel=info --concurrency=4
    environment:
      - MONGODB_URL=mongodb://mongodb:27017
      - MONGODB_DB_NAME=pitchcraft
      - REDIS_URL=redis://redis:6379/0
      - CELERY_BROKER_URL=redis://redis:6379/1
      - CELERY_RESULT_BACKEND=redis://redis:6379/2
      - EMBEDDING_SERVICE_URL=http://embedding:8001
    env_file:
      - ../../.env
    volumes:
      - uploaded_files:/data/uploads
      - pptx_output:/data/output
      - thumbnails_data:/data/thumbnails
    depends_on:
      - mongodb
      - redis
      - embedding
    networks:
      - pitchcraft_network

  embedding:
    build:
      context: ../../infrastructure/docker/embedding
      dockerfile: Dockerfile
    ports:
      - "8001:8001"
    volumes:
      - ~/.cache/huggingface:/root/.cache/huggingface
    networks:
      - pitchcraft_network

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3
    networks:
      - pitchcraft_network

  mongodb:
    image: mongo:7
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 3
    networks:
      - pitchcraft_network

  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - frontend
      - backend
    networks:
      - pitchcraft_network

networks:
  pitchcraft_network:
    driver: bridge

volumes:
  mongodb_data:
  redis_data:
  pptx_output:
  uploaded_files:
  thumbnails_data:
